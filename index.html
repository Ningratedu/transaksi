<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catatan Uang</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231E2A78'/%3E%3Ccircle cx='32' cy='28' r='22' fill='%23FFE27A'/%3E%3Ctext x='32' y='37' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='27' letter-spacing='-1.5' fill='%231E2A78'%3ERp%3C/text%3E%3Crect x='8' y='54' width='25' height='5' rx='2.5' fill='%23EF4F6A'/%3E%3Crect x='35' y='54' width='13' height='5' rx='2.5' fill='%23FF9F43'/%3E%3Crect x='50' y='54' width='6' height='5' rx='2.5' fill='%2318A874'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%231E2A78'/%3E%3Ccircle cx='32' cy='28' r='22' fill='%23FFE27A'/%3E%3Ctext x='32' y='37' text-anchor='middle' font-family='Arial,Helvetica,sans-serif' font-weight='900' font-size='27' letter-spacing='-1.5' fill='%231E2A78'%3ERp%3C/text%3E%3Crect x='8' y='54' width='25' height='5' rx='2.5' fill='%23EF4F6A'/%3E%3Crect x='35' y='54' width='13' height='5' rx='2.5' fill='%23FF9F43'/%3E%3Crect x='50' y='54' width='6' height='5' rx='2.5' fill='%2318A874'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1E2A78">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --kabut:#E8ECF6; --kertas:#FFFFFF; --tinta:#16183A; --samar:#6B7092; --garis:#E3E6F2;
  --indigo:#1E2A78; --kuning:#FFE27A; --masuk:#18A874; --keluar:#EF4F6A;
  --aksen:var(--keluar);
  --display:'Bricolage Grotesque','DM Sans',system-ui,sans-serif;
  --body:'DM Sans',system-ui,sans-serif;
}
body[data-tipe="masuk"]{--aksen:var(--masuk)}
*{box-sizing:border-box;margin:0}
html{background:var(--kabut)}
body{font-family:var(--body);color:var(--tinta);min-height:100vh;padding:20px 16px 56px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;display:grid;gap:18px}
@media(min-width:900px){.wrap{grid-template-columns:380px 1fr;align-items:start;gap:22px}.kiri{position:sticky;top:20px}}
.kiri,.kanan{display:grid;gap:18px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--kuning);outline-offset:2px}

/* hero */
.hero{background:var(--indigo);color:#fff;border-radius:28px;padding:22px 24px 24px;overflow:hidden;position:relative}
.hero::after{content:"";position:absolute;right:-70px;top:-70px;width:200px;height:200px;border-radius:50%;border:34px solid rgba(255,226,122,.09)}
.bar-atas{display:flex;align-items:center;justify-content:space-between;gap:8px;position:relative;z-index:1;flex-wrap:wrap}
.bulan{display:flex;align-items:center;gap:4px}
.bulan b{font-weight:700;min-width:130px;text-align:center;text-transform:capitalize}
.ikon{width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:18px;line-height:1}
.ikon:hover{background:rgba(255,255,255,.22)}
.status{white-space:nowrap;font-size:12px;display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);padding:6px 10px;border-radius:99px;border:0;color:#fff;cursor:default}
.status i{width:8px;height:8px;border-radius:50%;background:#9AA0BF}
.status[data-s="ok"] i{background:#3EE0A2}.status[data-s="sync"] i{background:var(--kuning)}.status[data-s="err"] i{background:#FF8095}
.status[data-s="err"]{cursor:pointer}
.sisa-label{margin-top:26px;font-size:14px;opacity:.75}
.sisa{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,58px);letter-spacing:-.03em;line-height:1.05;color:var(--kuning);margin-top:2px;white-space:nowrap;overflow:hidden}
.sisa.minus{color:#FFA3B3}
.dua{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.judul{font-family:var(--display);font-weight:700;font-size:17px}
.ringkas{margin-top:20px;font-size:13px;opacity:.75}
.mata{margin-left:8px;width:30px;height:30px;border-radius:50%;border:0;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;display:inline-grid;place-items:center;vertical-align:middle}
.mata:hover{background:rgba(255,255,255,.22)}
.filter{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex:1}
.chips button{border:1.5px solid var(--garis);background:#fff;border-radius:99px;padding:7px 14px;font-weight:500;font-size:14px;color:var(--samar);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--indigo);border-color:var(--indigo);color:#fff}
.filter select{width:auto;padding:8px 12px;font-size:14px}
.dua div{background:rgba(255,255,255,.09);border-radius:16px;padding:12px 14px;min-width:0}
.dua small{display:flex;align-items:center;gap:6px;font-size:12px;opacity:.8}
.dua small::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.dua .bdg{display:block;margin-top:6px;font-size:11.5px;line-height:1.35;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bdg b{font-weight:700;white-space:nowrap;display:inline-flex;align-items:center;gap:3px}
.bdg.baik b{color:#3EE0A2}.bdg.buruk b{color:#FF8095}.bdg.netral b{color:#fff}
.bdg:empty{display:none}
.dua strong{display:block;margin-top:4px;font-family:var(--display);font-size:17px;font-weight:700;white-space:nowrap;overflow:hidden}

/* kartu */
.kartu{background:var(--kertas);border-radius:22px;padding:20px;box-shadow:0 1px 0 var(--garis)}
.kartu h2{font-family:var(--display);font-size:18px;font-weight:700;margin-bottom:14px}
.toggle{display:grid;grid-template-columns:1fr 1fr;background:var(--kabut);border-radius:14px;padding:4px;margin-bottom:14px}
.toggle button{border:0;background:none;padding:10px;border-radius:11px;font-weight:700;cursor:pointer;color:var(--samar)}
.toggle button[aria-pressed="true"]{background:#fff;color:var(--aksen);box-shadow:0 2px 8px rgba(22,24,58,.1)}
label{display:block;font-size:13px;color:var(--samar);margin:12px 0 5px}
.in{width:100%;border:1.5px solid var(--garis);background:#fff;border-radius:12px;padding:11px 13px}
.in:focus{outline:none;border-color:var(--aksen)}
.rupiah{position:relative}
.rupiah span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-weight:700;color:var(--samar)}
.rupiah .in{padding-left:44px;font-family:var(--display);font-size:24px;font-weight:700;letter-spacing:-.01em}
.dua-in{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tglbox{position:relative}.tglbox .in{padding-right:42px}.kal{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:none;border-radius:9px;color:var(--samar);cursor:pointer;display:grid;place-items:center}.kal:hover{background:var(--kabut)}#tglNative{position:absolute;right:0;bottom:0;width:1px;height:1px;opacity:0;pointer-events:none}
.pilih{width:100%;border:1.5px dashed #C4CAE3;background:var(--kabut);border-radius:12px;padding:12px;color:var(--samar);font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.pilih:hover{border-color:var(--aksen);color:var(--aksen)}
.prev{display:flex;align-items:center;gap:12px;border:1.5px solid var(--garis);border-radius:12px;padding:8px}
.prev img{width:48px;height:48px;object-fit:cover;border-radius:8px}
.prev span{flex:1;min-width:0;font-size:13px;color:var(--samar);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prev button{width:30px;height:30px;border-radius:50%;border:0;background:none;color:var(--samar);font-size:18px;cursor:pointer}
.prev button:hover{background:#FDE7EB;color:var(--keluar)}
.bukti{display:inline-flex;align-items:center;gap:4px;font:inherit;font-size:12px;font-weight:500;color:var(--indigo);background:var(--kabut);padding:3px 9px;border:0;border-radius:99px;cursor:pointer;white-space:nowrap}
.bukti:hover{background:#DCE1F2}.bukti.up{color:var(--samar)}
.bukti.tambah{background:none;border:1.5px dashed #C4CAE3;color:var(--samar);padding:2px 9px}
.bukti.tambah:hover{border-color:var(--indigo);color:var(--indigo)}
[hidden]{display:none!important}
dialog.lb{border:0;border-radius:22px;padding:0;width:min(94vw,720px);max-width:94vw;background:var(--kertas);color:var(--tinta);overflow:hidden;margin:auto}
dialog.lb::backdrop{background:rgba(22,24,58,.72)}
.lb-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--garis)}
.lb-head b{font-family:var(--display);font-size:17px}
.lb-head small{display:block;color:var(--samar);font-size:13px;margin-top:2px;overflow-wrap:anywhere}
.tutup{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:var(--kabut);color:var(--tinta);font-size:20px;line-height:1;cursor:pointer}
.tutup:hover{background:#DCE1F2}
.lb-body{background:var(--kabut);display:grid;place-items:center;min-height:180px;max-height:72vh;overflow:auto}
.lb-body img{max-width:100%;max-height:72vh;display:block}
.lb-body iframe{width:100%;height:68vh;border:0}
.lb-load{color:var(--samar);padding:48px 16px}
.lb-foot:empty{display:none}
.lb-foot{padding:12px 16px;display:flex;justify-content:flex-end;border-top:1px solid var(--garis)}
.lb-foot a{color:var(--indigo);font-weight:500;font-size:14px}
.simpan{margin-top:18px;width:100%;border:0;border-radius:14px;padding:14px;background:var(--aksen);color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:transform .12s,filter .12s}
.simpan:hover{filter:brightness(1.06)}.simpan:active{transform:scale(.98)}

/* ringkasan kategori */
.sum-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.sum-head .chips{flex:none}
.sum-total{font-size:13px;color:var(--samar)}
.sum-total b{font-family:var(--display);font-size:17px;color:var(--tinta);margin-left:4px}
.kat-baris{display:block;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--garis);padding:12px 8px;margin:0 -8px;width:calc(100% + 16px);border-radius:0;cursor:pointer;transition:background .15s}
.kat-baris:first-of-type{border-top:0}
.kat-baris:hover{background:var(--kabut)}
.kat-baris[aria-pressed="true"]{background:var(--kabut);box-shadow:inset 3px 0 0 var(--indigo)}
.kat-atas{display:grid;grid-template-columns:12px 1fr auto;gap:12px;align-items:center}
.kat-atas i{width:12px;height:12px;border-radius:50%}
.kat-atas .n{display:block;font-weight:700;font-size:15px}
.kat-atas .s{display:block;font-size:12px;color:var(--samar);margin-top:1px}
.kat-atas .a{text-align:right;font-family:var(--display);font-weight:700;white-space:nowrap}
.kat-atas .a small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--samar);margin-top:1px}
.kat-bar{display:block;height:6px;border-radius:99px;background:var(--kabut);margin:9px 0 0 24px;overflow:hidden}
.kat-baris:hover .kat-bar,.kat-baris[aria-pressed="true"] .kat-bar{background:#fff}
.filter-kat{display:flex;align-items:center;gap:8px;margin:-4px 0 14px;font-size:13px;color:var(--samar)}
.filter-kat button{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--indigo);color:#fff;border-radius:99px;padding:5px 8px 5px 12px;font-weight:500;font-size:13px;cursor:pointer}
.filter-kat button:hover{filter:brightness(1.15)}
.kat-bar span{display:block;height:100%;width:0;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.kosong.kecil{padding:22px 10px}

/* daftar */
.tgl{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;color:var(--samar);padding:14px 0 6px;font-weight:500}
.tgl:first-of-type{padding-top:0}
.tgl b{font-weight:700;color:var(--tinta)}
.baris{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--garis)}
.kn{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.baris i{width:12px;height:12px;border-radius:50%}
.baris .k{font-weight:700;font-size:15px}
.baris .c{font-size:13px;color:var(--samar);overflow-wrap:anywhere}
.baris .j{font-family:var(--display);font-weight:700;font-size:15px;white-space:nowrap}.baris>div:nth-child(2){min-width:0}
.baris .j.m{color:var(--masuk)}.baris .j.k{color:var(--keluar)}
.kosong{text-align:center;padding:36px 10px;color:var(--samar);line-height:1.6}
.kosong b{display:block;font-family:var(--display);font-size:18px;color:var(--tinta);margin-bottom:4px}
.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);background:var(--tinta);color:#fff;padding:11px 18px;border-radius:16px;font-size:14px;line-height:1.45;text-align:center;width:max-content;overflow-wrap:anywhere;opacity:0;pointer-events:none;transition:.25s;z-index:9;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body data-tipe="keluar">
<div class="wrap">
  <div class="kiri">
    <section class="hero" aria-label="Ringkasan saldo">
      <div class="bar-atas">
        <b class="judul">Saldo</b>
        <button class="status" id="status" data-s="lokal" title=""><i></i><span>Lokal</span></button>
      </div>
      <div class="sisa-label">Saldo saat ini<button type="button" class="mata" id="mata" aria-label="Sembunyikan saldo" aria-pressed="false"></button></div>
      <div class="sisa" id="sisa">Rp 0</div>
      <div class="ringkas" id="ringkasLabel"></div>
      <div class="dua">
        <div style="--c:var(--masuk)"><small>Pemasukan</small><strong id="tMasuk">Rp 0</strong><span class="bdg" id="bMasuk"></span></div>
        <div style="--c:var(--keluar)"><small>Pengeluaran</small><strong id="tKeluar">Rp 0</strong><span class="bdg" id="bKeluar"></span></div>
      </div>
    </section>

    <section class="kartu">
      <h2>Catat transaksi</h2>
      <div class="toggle" role="group" aria-label="Jenis transaksi">
        <button type="button" data-t="keluar" aria-pressed="true">Pengeluaran</button>
        <button type="button" data-t="masuk" aria-pressed="false">Pemasukan</button>
      </div>
      <label for="jumlah" style="margin-top:0">Jumlah</label>
      <div class="rupiah"><span>Rp</span><input class="in" id="jumlah" inputmode="numeric" placeholder="0" autocomplete="off"></div>
      <div class="dua-in">
        <div><label for="kategori">Kategori</label><select class="in" id="kategori"></select></div>
        <div><label for="tanggal">Tanggal</label><div class="tglbox"><input class="in" id="tanggal" inputmode="numeric" placeholder="dd-mm-yyyy" maxlength="10" autocomplete="off"><button type="button" class="kal" id="kal" aria-label="Pilih dari kalender"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg></button><input type="date" id="tglNative" tabindex="-1" aria-hidden="true"></div></div>
      </div>
      <div id="lainBox" hidden><label for="kategoriLain">Nama kategori</label>
      <input class="in" id="kategoriLain" maxlength="30" placeholder="mis. Hadiah, Parkir, Donasi" autocomplete="off"></div>
      <label for="catatan">Catatan (opsional)</label>
      <input class="in" id="catatan" maxlength="80" placeholder="mis. makan siang bareng tim" autocomplete="off">
      <label for="pilihBukti">Bukti (opsional)</label>
      <input type="file" id="buktiFile" accept="image/*" hidden>
      <button type="button" class="pilih" id="pilihBukti"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/></svg>Tambah foto struk / bukti</button>
      <div class="prev" id="buktiPrev" hidden><img id="buktiImg" alt="Pratinjau bukti"><span id="buktiNama"></span><button type="button" id="buktiHapus" aria-label="Hapus bukti">×</button></div>
      <button class="simpan" id="simpan" type="button">Simpan pengeluaran</button>
    </section>
  </div>

  <div class="kanan">
  <section class="kartu" aria-label="Ringkasan per kategori">
    <h2>Ringkasan kategori</h2>
    <div class="sum-head">
      <div class="chips" id="chipSum" role="group" aria-label="Jenis ringkasan">
        <button type="button" data-s="keluar" aria-pressed="true">Keluar</button>
        <button type="button" data-s="masuk" aria-pressed="false">Masuk</button>
      </div>
      <div class="sum-total" id="sumTotal"></div>
    </div>
    <div id="sumList"></div>
  </section>

  <section class="kartu">
    <h2 id="judulMutasi">Mutasi</h2>
    <div class="filter">
      <div class="chips" id="chipTipe" role="group" aria-label="Jenis transaksi">
        <button type="button" data-f="semua" aria-pressed="true">Semua</button>
        <button type="button" data-f="masuk" aria-pressed="false">Masuk</button>
        <button type="button" data-f="keluar" aria-pressed="false">Keluar</button>
      </div>
      <select class="in" id="periode" aria-label="Periode">
        <option value="semua">Semua waktu</option><option value="7">7 hari terakhir</option><option value="bulan">Bulan ini</option><option value="lalu">Bulan lalu</option>
      </select>
    </div>
    <div class="filter-kat" id="filterKat" hidden></div>
    <div id="daftar"></div>
  </section>
  </div>
</div>
<input type="file" id="buktiLain" accept="image/*" hidden>
<dialog class="lb" id="lb" aria-labelledby="lbJudul">
  <div class="lb-head"><div><b id="lbJudul"></b><small id="lbInfo"></small></div><button type="button" class="tutup" id="lbTutup" aria-label="Tutup">×</button></div>
  <div class="lb-body" id="lbBody"></div>
  <div class="lb-foot" id="lbFoot"></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
/* ====== PENGATURAN ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyu1xpTJt8KWu8v4HckIbf2j-zgzDVd96z0cpUw_GShrUDPuBbAD5unQnU9E2xRUtYOng/exec'; // URL deploy Apps Script (berakhiran /exec)
const KUNCI   = '';                          // samakan dengan KUNCI di Code.gs (boleh kosong)
/* ======================== */

const KAT = {
  keluar:{Makan:'#EF4F6A',Transport:'#FF9F43',Belanja:'#A66CFF',Tagihan:'#3D7BFF',Hiburan:'#19B5C9',Kesehatan:'#7BC043',Lainnya:'#9AA0BF'},
  masuk:{Gaji:'#18A874',Bonus:'#7BC043',Lainnya:'#9AA0BF'}
};
const terhubung = /^https:\/\/script\.google\.com\//.test(API_URL);
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2,'0');
const rp = n => 'Rp\u00a0' + Math.round(n).toLocaleString('id-ID');
const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hariIni = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const keTampil = iso => iso.split('-').reverse().join('-'); // yyyy-mm-dd → dd-mm-yyyy
const BLN = ['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
const BLN_P = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
const namaBulan = k => { const [y,m] = k.split('-'); return BLN_P[+m-1] + ' ' + y; };
const tglPendek = iso => { const [y,m,d] = iso.split('-'); return `${+d} ${BLN[+m-1]} ${y}`; }; // 2026-10-20 → 20 Okt 2026
const keIso = s => { const m=/^(\d{2})-(\d{2})-(\d{4})$/.exec(s.trim()); if(!m) return null; const d=+m[1],mo=+m[2],y=+m[3]; const dt=new Date(y,mo-1,d); return (dt.getFullYear()===y&&dt.getMonth()===mo-1&&dt.getDate()===d) ? `${m[3]}-${m[2]}-${m[1]}` : null; };
function fit(){ document.querySelectorAll('.sisa,.dua strong,.dua .bdg').forEach(el=>{ el.style.fontSize=''; let fs=parseFloat(getComputedStyle(el).fontSize); while(el.scrollWidth>el.clientWidth && fs>10){ fs-=1; el.style.fontSize=fs+'px'; } }); }
const PALET_LAIN = ['#E8590C','#2B8A3E','#862E9C','#1971C2','#C2255C','#5F3DC4','#0B7285','#A61E4D','#5C940D','#D9480F'];
const warna = (t,k) => {
  if(KAT[t] && KAT[t][k]) return KAT[t][k];
  let h = 0; const s = String(k||'').toLowerCase();
  for(let i=0;i<s.length;i++) h = (h*31 + s.charCodeAt(i)) >>> 0;
  return PALET_LAIN[h % PALET_LAIN.length];
};

let items = [];
try { items = JSON.parse(localStorage.getItem('catatan_uang') || '[]'); } catch(e) {}
let fTipe = 'semua', fPeriode = 'semua', fSum = 'keluar', fKat = null;
let sembunyi = false;
try { sembunyi = localStorage.getItem('sembunyi_saldo') === '1'; } catch(e) {}
let tipe = 'keluar';
let buktiData = null;
const IKON_BUKTI = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/></svg>';

const simpanLokal = () => { try { localStorage.setItem('catatan_uang', JSON.stringify(items.map(({buktiTmp,...x})=>x))); } catch(e) {} };
const pesanGalat = m => /izin|permission|authori[sz]/i.test(m||'') ? 'Script belum punya izin Drive penuh. Jalankan izinDrive di Apps Script, lalu deploy versi baru.' : (m || 'cek koneksi');
function toast(t,ms=2600){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>el.classList.remove('on'),ms); }
function setStatus(s,pesan){
  const el=$('#status'); el.dataset.s=s;
  el.querySelector('span').textContent = {ok:'Tersinkron',sync:'Menyinkronkan…',err:'Gagal · coba lagi',lokal:'Mode lokal'}[s];
  el.title = pesan || (s==='lokal' ? 'Data hanya di browser ini. Isi API_URL untuk sinkron ke Google Sheets.' : '');
}

/* ---- API ---- */
async function api(body){
  const r = await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,kunci:KUNCI})});
  const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Gagal'); return j;
}
async function muat(){
  if(!terhubung){ setStatus('lokal'); return; }
  setStatus('sync');
  try{
    const r = await fetch(API_URL + '?kunci=' + encodeURIComponent(KUNCI));
    const j = await r.json(); if(!j.ok) throw new Error(j.error || 'Gagal');
    items = j.data; simpanLokal(); render(); setStatus('ok');
  }catch(e){ setStatus('err', e.message); }
}

/* ---- render ---- */
const LABEL_STATIS = {semua:'semua waktu','7':'7 hari terakhir',bulan:'bulan ini',lalu:'bulan lalu'};
const labelPeriode = () => fPeriode.startsWith('m:') ? 'bulan ' + namaBulan(fPeriode.slice(2)) : LABEL_STATIS[fPeriode];
const IKON_MATA = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
const IKON_MATA_OFF = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19c-6.4 0-10-7-10-7a18 18 0 0 1 5-5.7M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M1 1l22 22"/></svg>';
const kunciBulan = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}`;
function dalamPeriode(x){
  if(fPeriode === 'semua') return true;
  const now = new Date();
  if(fPeriode === '7'){ const d = new Date(now); d.setDate(d.getDate()-6); return x.tanggal >= `${kunciBulan(d)}-${pad(d.getDate())}`; }
  if(fPeriode.startsWith('m:')) return x.tanggal.slice(0,7) === fPeriode.slice(2);
  if(fPeriode === 'bulan') return x.tanggal.slice(0,7) === kunciBulan(now);
  return x.tanggal.slice(0,7) === kunciBulan(new Date(now.getFullYear(), now.getMonth()-1, 1));
}
const PANAH = {
  naik:  '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  turun: '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12l7 7 7-7"/></svg>'
};
const isoD = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
function periodeSebelumnya(){
  const now = new Date(), y = now.getFullYear(), m = now.getMonth(), t = now.getDate();
  if(fPeriode === '7'){
    const a = new Date(y,m,t-13), b = new Date(y,m,t-7);
    return {dari:isoD(a), sampai:isoD(b), label:'7 hari sebelumnya'};
  }
  if(fPeriode === 'bulan'){
    const awal = new Date(y,m-1,1), akhirBln = new Date(y,m,0).getDate();
    return {dari:isoD(awal), sampai:isoD(new Date(y,m-1,Math.min(t,akhirBln))), label:'bulan lalu'};
  }
  if(fPeriode === 'lalu'){
    return {dari:isoD(new Date(y,m-2,1)), sampai:isoD(new Date(y,m-1,0)), label:'2 bulan lalu'};
  }
  if(fPeriode.startsWith('m:')){
    const [yy,mm] = fPeriode.slice(2).split('-').map(Number);
    const a = new Date(yy,mm-2,1), b = new Date(yy,mm-1,0);
    return {dari:isoD(a), sampai:isoD(b), label:BLN[a.getMonth()] + ' ' + a.getFullYear()};
  }
  return null; // semua waktu: tidak ada pembanding
}
function isiPeriode(){
  const now = new Date(), cur = kunciBulan(now), lalu = kunciBulan(new Date(now.getFullYear(), now.getMonth()-1, 1));
  const set = new Set(items.map(x => String(x.tanggal||'').slice(0,7)));
  if(fPeriode.startsWith('m:')) set.add(fPeriode.slice(2));
  set.delete(cur); set.delete(lalu); set.delete('');
  const list = [...set].sort().reverse();
  const sel = $('#periode'), sig = list.join(',');
  if(isiPeriode.sig !== sig){
    isiPeriode.sig = sig;
    sel.innerHTML = '<option value="semua">Semua waktu</option><option value="7">7 hari terakhir</option><option value="bulan">Bulan ini</option><option value="lalu">Bulan lalu</option>'
      + (list.length ? '<optgroup label="Bulan lainnya">' + list.map(k=>`<option value="m:${k}">${namaBulan(k)}</option>`).join('') + '</optgroup>' : '');
  }
  sel.value = fPeriode;
}
function render(){
  isiPeriode();
  const jml = (arr,t) => arr.filter(x=>x.tipe===t).reduce((a,x)=>a+x.jumlah,0);

  // saldo = seluruh transaksi, tidak dipengaruhi filter
  const saldo = jml(items,'masuk') - jml(items,'keluar');
  const s = $('#sisa');
  s.textContent = sembunyi ? 'Rp\u00a0••••••' : (saldo<0?'−':'') + rp(Math.abs(saldo));
  s.classList.toggle('minus', saldo<0 && !sembunyi);
  const mata = $('#mata');
  mata.innerHTML = sembunyi ? IKON_MATA_OFF : IKON_MATA;
  mata.setAttribute('aria-pressed', sembunyi);
  mata.setAttribute('aria-label', sembunyi ? 'Tampilkan saldo' : 'Sembunyikan saldo');

  // ringkasan mengikuti periode
  const per = items.filter(dalamPeriode);
  const masuk = jml(per,'masuk'), keluar = jml(per,'keluar');
  $('#ringkasLabel').textContent = 'Ringkasan ' + labelPeriode();
  $('#tMasuk').textContent = rp(masuk); $('#tKeluar').textContent = rp(keluar);
  fit();

  // perbandingan dengan periode sebelumnya
  const pb = periodeSebelumnya();
  const bandingkan = (id, cur, t, naikBaik) => {
    const el = $(id);
    if(!pb){ el.innerHTML = ''; el.className = 'bdg'; return; }
    const prev = jml(items.filter(x => x.tanggal >= pb.dari && x.tanggal <= pb.sampai), t);
    el.title = pb.label + ' (' + tglPendek(pb.dari) + ' – ' + tglPendek(pb.sampai) + '): ' + rp(prev);
    if(!prev && !cur){ el.innerHTML = ''; el.className = 'bdg'; return; }
    if(!prev){ el.className = 'bdg netral'; el.innerHTML = `<b>Baru</b> · ${esc(pb.label)} kosong`; return; }
    const pct = Math.round((cur-prev)/prev*100);
    if(pct === 0){ el.className = 'bdg netral'; el.innerHTML = `<b>Sama</b> vs ${esc(pb.label)}`; return; }
    const naik = pct > 0;
    el.className = 'bdg ' + (naik === naikBaik ? 'baik' : 'buruk');
    el.innerHTML = `<b>${naik?PANAH.naik:PANAH.turun}<span class="sr">${naik?'Naik':'Turun'} </span>${Math.abs(pct)}%</b> vs ${esc(pb.label)}`;
  };
  bandingkan('#bMasuk', masuk, 'masuk', true);
  bandingkan('#bKeluar', keluar, 'keluar', false);
  fit();

  // ringkasan per kategori: ikut periode, punya toggle keluar/masuk sendiri
  const totalSum = fSum==='keluar' ? keluar : masuk;
  const gs = {};
  per.filter(x=>x.tipe===fSum).forEach(x => {
    const nm = String(x.kategori||'').trim() || 'Lainnya', low = nm.toLowerCase();
    const o = gs[low] = gs[low] || {nama: Object.keys(KAT[fSum]).find(k=>k.toLowerCase()===low) || nm, v:0, n:0};
    o.v += x.jumlah; o.n++;
  });
  const urutSum = Object.entries(gs).sort((a,b)=>b[1].v-a[1].v);
  document.querySelectorAll('#chipSum button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.s===fSum));
  $('#sumTotal').innerHTML = urutSum.length ? `Total ${fSum==='keluar'?'keluar':'masuk'}<b>${rp(totalSum)}</b>` : '';
  $('#sumList').innerHTML = urutSum.length
    ? urutSum.map(([low,o])=>{
        const p = totalSum ? o.v/totalSum*100 : 0, on = fKat===low;
        return `<button type="button" class="kat-baris" data-kat="${esc(low)}" aria-pressed="${on}" title="Lihat transaksi ${esc(o.nama)}"><span class="kat-atas"><i style="background:${warna(fSum,o.nama)}"></i>
          <span><span class="n">${esc(o.nama)}</span><span class="s">${o.n} transaksi · rata-rata ${rp(o.v/o.n)}</span></span>
          <span class="a">${rp(o.v)}<small>${p<1 ? '<1' : Math.round(p)}%</small></span></span>
          <span class="kat-bar"><span style="background:${warna(fSum,o.nama)}" data-w="${p.toFixed(2)}"></span></span></button>`;
      }).join('')
    : `<div class="kosong kecil">Belum ada ${fSum==='keluar'?'pengeluaran':'pemasukan'} di ${labelPeriode()}.</div>`;
  requestAnimationFrame(()=>requestAnimationFrame(()=>document.querySelectorAll('#sumList .kat-bar span').forEach(e=>e.style.width=e.dataset.w+'%')));

  // mutasi: ikut filter jenis + periode
  const katKey = x => (String(x.kategori||'').trim() || 'Lainnya').toLowerCase();
  const tampil = per.filter(x => (fTipe==='semua' || x.tipe===fTipe) && (!fKat || katKey(x)===fKat));
  const fk = $('#filterKat');
  if(fKat){
    const nama = (gs[fKat] && gs[fKat].nama) || fKat;
    fk.hidden = false;
    fk.innerHTML = `Menampilkan kategori <button type="button" id="hapusKat" aria-label="Hapus filter kategori">${esc(nama)} <span aria-hidden="true">×</span></button>`;
  } else { fk.hidden = true; fk.innerHTML = ''; }
  const d = $('#daftar');
  if(!tampil.length){
    d.innerHTML = items.length
      ? '<div class="kosong"><b>Tidak ada transaksi</b>Coba ganti filter jenis atau periode.</div>'
      : '<div class="kosong"><b>Belum ada catatan</b>Isi form untuk mencatat transaksi pertama.</div>';
    return;
  }
  const urutan = [...tampil].sort((a,b)=>b.tanggal.localeCompare(a.tanggal));
  let html = '', cur = '';
  urutan.forEach(x=>{
    if(x.tanggal !== cur){
      cur = x.tanggal;
      const total = tampil.filter(y=>y.tanggal===cur && y.tipe==='keluar').reduce((a,y)=>a+y.jumlah,0);
      const label = tglPendek(cur);
      html += `<div class="tgl"><b>${label}</b><span>${total ? 'Keluar ' + rp(total) : ''}</span></div>`;
    }
    const m = x.tipe==='masuk';
    const bk = (x.bukti || x.buktiTmp) ? `<button type="button" class="bukti${x.bukti?'':' up'}" data-lihat="${esc(x.id)}">${IKON_BUKTI}${x.bukti?'Lihat bukti':'Mengunggah…'}</button>` : `<button type="button" class="bukti tambah" data-tambah="${esc(x.id)}">${IKON_PLUS}Tambah bukti</button>`;
    html += `<div class="baris"><i style="background:${warna(x.tipe,x.kategori)}"></i>
      <div><div class="k">${esc(x.kategori)}</div>${x.catatan?`<div class="c">${esc(x.catatan)}</div>`:''}</div>
      <div class="kn"><div class="j ${m?'m':'k'}">${m?'+':'−'}${rp(x.jumlah)}</div>${bk}</div></div>`;
  });
  d.innerHTML = html;
}

document.querySelectorAll('#chipTipe button').forEach(b=>b.onclick=()=>{ setChip(b.dataset.f); if(fKat && b.dataset.f!=='semua' && b.dataset.f!==fSum) fKat = null; render(); });
document.querySelectorAll('#chipSum button').forEach(b=>b.onclick=()=>{ fSum = b.dataset.s; fKat = null; if(fTipe!=='semua') setChip(fSum); render(); });

document.addEventListener('click', e => { if(e.target.closest('#hapusKat')){ fKat = null; render(); } });
$('#periode').onchange = e => { fPeriode = e.target.value; render(); };
$('#mata').onclick = () => { sembunyi = !sembunyi; try{ localStorage.setItem('sembunyi_saldo', sembunyi?'1':'0'); }catch(e){} render(); };
$('#status').onclick = () => { if($('#status').dataset.s==='err') muat(); };

$('#simpan').onclick = async () => {
  const jumlah = parseInt($('#jumlah').value.replace(/\D/g,''),10) || 0;
  const tanggal = keIso($('#tanggal').value);
  if(jumlah <= 0) return toast('Isi jumlah lebih dari 0');
  if(!tanggal) return toast('Tanggal tidak valid, pakai format dd-mm-yyyy');
  const kat = ($('#kategori').value === 'Lainnya' && $('#kategoriLain').value.trim()) || $('#kategori').value;
  const item = { id: Date.now().toString(36)+Math.random().toString(36).slice(2,6), tanggal, tipe, kategori:kat, jumlah, catatan:$('#catatan').value.trim() };
  const kirim = {...item}, foto = buktiData;
  if(foto){ if(terhubung) item.buktiTmp = foto; else item.bukti = foto; }
  items.unshift(item); simpanLokal();
  if(!dalamPeriode(item)){ fPeriode = 'semua'; $('#periode').value = 'semua'; }
  if(fTipe!=='semua' && fTipe!==item.tipe) setChip('semua');
  if(fKat && item.tipe===fSum && String(item.kategori).trim().toLowerCase()!==fKat) fKat = null;
  if(fKat && item.tipe!==fSum) fKat = null;
  $('#jumlah').value = ''; $('#catatan').value = ''; $('#kategoriLain').value = ''; resetBukti();
  render(); toast(tipe==='keluar' ? 'Pengeluaran tersimpan' : 'Pemasukan tersimpan');
  if(terhubung){
    setStatus('sync');
    try{ const r = await api({action:'add', item:kirim, buktiData:foto}); delete item.buktiTmp; if(r.bukti) item.bukti = r.bukti;
      if(r.buktiError) toast('Transaksi tersimpan, tapi bukti gagal diunggah. ' + pesanGalat(r.buktiError), 7000); simpanLokal(); render(); setStatus('ok'); }
    catch(e){ items = items.filter(x=>x.id!==item.id); simpanLokal(); render(); setStatus('err', e.message); toast('Gagal menyimpan. ' + pesanGalat(e.message), 6000); }
  }
};

$('#tanggal').addEventListener('input',e=>{ const n=e.target.value.replace(/\D/g,'').slice(0,8); e.target.value = n.length>4 ? n.slice(0,2)+'-'+n.slice(2,4)+'-'+n.slice(4) : n.length>2 ? n.slice(0,2)+'-'+n.slice(2) : n; });
$('#kal').onclick = () => { const n=$('#tglNative'); n.value = keIso($('#tanggal').value) || hariIni(); try{ n.showPicker(); }catch(e){ n.focus(); n.click(); } };
$('#tglNative').onchange = e => { if(e.target.value) $('#tanggal').value = keTampil(e.target.value); };
function kompres(file){
  return new Promise((res,rej)=>{
    const img = new Image(), u = URL.createObjectURL(file);
    img.onload = () => {
      const r = Math.min(1, 1280/Math.max(img.width,img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u);
      res(c.toDataURL('image/jpeg',0.7));
    };
    img.onerror = () => rej(new Error('Gambar tidak bisa dibaca'));
    img.src = u;
  });
}
function resetBukti(){ buktiData = null; $('#buktiFile').value = ''; $('#buktiPrev').hidden = true; $('#pilihBukti').hidden = false; }
$('#pilihBukti').onclick = () => $('#buktiFile').click();
$('#buktiHapus').onclick = resetBukti;
$('#buktiFile').onchange = async e => {
  const f = e.target.files[0]; if(!f) return;
  try{
    buktiData = await kompres(f);
    $('#buktiImg').src = buktiData; $('#buktiNama').textContent = f.name;
    $('#buktiPrev').hidden = false; $('#pilihBukti').hidden = true;
  }catch(err){ resetBukti(); toast(err.message); }
};
const IKON_PLUS = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
let tambahId = null;
$('#daftar').addEventListener('click', e => {
  const b = e.target.closest('[data-tambah]'); if(!b) return;
  tambahId = b.dataset.tambah; $('#buktiLain').click();
});
$('#buktiLain').onchange = async e => {
  const f = e.target.files[0]; e.target.value = '';
  if(!f || !tambahId) return;
  const id = tambahId; tambahId = null;
  const x = items.find(i => i.id === id); if(!x) return;
  let data;
  try{ data = await kompres(f); }catch(err){ return toast(err.message); }
  if(!terhubung){ x.bukti = data; simpanLokal(); render(); toast('Bukti ditambahkan'); return; }
  x.buktiTmp = data; render(); setStatus('sync');
  try{
    const r = await api({action:'bukti', id, buktiData:data});
    const y = items.find(i => i.id === id) || x;
    delete y.buktiTmp; y.bukti = r.bukti || ''; simpanLokal(); render(); setStatus('ok'); toast('Bukti terunggah');
  }catch(err){
    const y = items.find(i => i.id === id) || x;
    delete y.buktiTmp; render(); setStatus('err', err.message);
    toast('Gagal mengunggah bukti. ' + pesanGalat(err.message), 7000);
  }
};
const idDrive = u => { const m = /\/d\/([^\/?#]+)/.exec(u || ''); return m ? m[1] : null; };
function lihatBukti(id){
  const x = items.find(i => i.id === id); if(!x) return;
  const src = x.bukti || x.buktiTmp; if(!src) return;
  $('#lbJudul').textContent = x.kategori + ' ' + (x.tipe==='masuk' ? '+' : '−') + rp(x.jumlah);
  $('#lbInfo').textContent = tglPendek(x.tanggal) + (x.catatan ? ', ' + x.catatan : '');
  const body = $('#lbBody'), foot = $('#lbFoot');
  body.innerHTML = ''; foot.innerHTML = '';
  const load = document.createElement('div'); load.className = 'lb-load'; load.textContent = 'Memuat foto…';
  const img = new Image(); img.alt = 'Foto bukti transaksi'; img.hidden = true;
  img.onload = () => { load.remove(); img.hidden = false; };
  const did = idDrive(src);
  if(did){
    img.onerror = () => { body.innerHTML = ''; const f = document.createElement('iframe'); f.src = `https://drive.google.com/file/d/${did}/preview`; f.title = 'Pratinjau bukti'; body.appendChild(f); };
    img.src = `https://drive.google.com/thumbnail?id=${did}&sz=w1600`;
    const a = document.createElement('a'); a.href = src; a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Buka di Drive'; foot.appendChild(a);
  } else {
    img.onerror = () => { load.textContent = 'Foto tidak bisa ditampilkan'; };
    img.src = src;
  }
  body.append(load, img);
  $('#lb').showModal();
}
$('#daftar').addEventListener('click', e => { const b = e.target.closest('[data-lihat]'); if(b) lihatBukti(b.dataset.lihat); });
$('#lbTutup').onclick = () => $('#lb').close();
$('#lb').addEventListener('click', e => { if(e.target === e.currentTarget) $('#lb').close(); });
$('#lb').addEventListener('close', () => { $('#lbBody').innerHTML = ''; });
window.addEventListener('resize', fit);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
$('#tanggal').value = keTampil(hariIni());
$('#periode').value = fPeriode;
setTipe('keluar'); render(); muat();
</script>
</body>
